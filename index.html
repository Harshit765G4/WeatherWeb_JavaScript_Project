<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button title="Search">
                <img src="weather-app-img\images\search.png" alt="Search icon">
            </button>
        </div>
        <div class="weather">
            <img src="weather-app-img\images\rain.png" class="weather-icon" alt="Rainy weather icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">New Delhi</h2>
            <div class="details">
                <div class="col">
                    <img src="weather-app-img\images\humidity.png" alt="Humidity icon">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                        <img src="weather-app-img\images\wind.png" alt="wind icon">
                    <div>
                        <p class="wind">15 Km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        
        const apiKey="5f9e2da9962804584f7449b59a9dc695";
        const apiUrl="https://api.openweathermap.org/data/2.5/weather?units=metric&q=panipat";

        async function checkWeather(){
            const response = await fetch(apiUrl + `&appid=${apiKey}`);

            var data = await response.json();

            console.log(data);


            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
            document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
            document.querySelector(".wind").innerHTML = data.wind.speed + " Km/h";


        }

        checkWeather();
        
    </script>

</body>
</html>
